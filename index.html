<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Avatar CLB</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #0b132b; color: #fff; padding: 20px; }
    .container { max-width: 450px; width: 100%; display: flex; flex-direction: column; gap: 15px; align-items: center; }
    canvas { width: 100%; max-width: 360px; height: auto; border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .controls { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; border-radius: 8px; border: none; font-size: 15px; }
    button { background: #00d2ff; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #3a7bd5; color: #fff; }
    label { font-size: 13px; color: #a0aec0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ghép Avatar Khung CLB</h2>
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas" width="1080" height="1080"></canvas>
    
    <div class="controls">
      <label>Kích thước ảnh:</label>
      <input type="range" id="zoom" min="0.2" max="3" step="0.05" value="1">
      <label>Vị trí Ngang / Dọc:</label>
      <input type="range" id="posX" min="-500" max="500" value="0">
      <input type="range" id="posY" min="-500" max="500" value="0">
      <button id="download">Tải Ảnh Hoàn Chỉnh</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    const zoom = document.getElementById('zoom');
    const posX = document.getElementById('posX');
    const posY = document.getElementById('posY');
    const download = document.getElementById('download');

    let userImg = null;
    const frameImg = new Image();
    frameImg.src = 'frame.png';
    frameImg.onload = draw;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        userImg = new Image();
        userImg.onload = draw;
        userImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function draw() {
      ctx.clearRect(0, 0, 1080, 1080);
      if (userImg) {
        const scale = parseFloat(zoom.value);
        const w = userImg.width * scale;
        const h = userImg.height * scale;
        const x = (1080 - w) / 2 + parseFloat(posX.value);
        const y = (1080 - h) / 2 + parseFloat(posY.value);
        ctx.drawImage(userImg, x, y, w, h);
      }
      if (frameImg.complete) {
        ctx.drawImage(frameImg, 0, 0, 1080, 1080);
      }
    }

    [zoom, posX, posY].forEach(input => input.addEventListener('input', draw));

    download.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'avatar-clb.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
